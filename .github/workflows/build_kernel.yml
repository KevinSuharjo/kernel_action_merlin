name: Build Merlin Kernel with KernelSU & Droidspaces

on:
  workflow_dispatch:
    # Bisa ditrigger manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-postgresql: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 make

      - name: Setup Clang Toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang --depth=1

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Inject Droidspaces & KernelSU Configs into Defconfig
        run: |
          echo "" >> arch/arm64/configs/merlin_defconfig
          echo "# KernelSU & Droidspaces Config" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_SYSCTL=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_SYSVIPC=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_NAMESPACES=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_PID_NS=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_UTS_NS=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_IPC_NS=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_SECCOMP=y" >> arch/arm64/configs/merlin_defconfig
          echo "CONFIG_SECCOMP_FILTER=y" >> arch/arm64/configs/merlin_defconfig

      - name: Start Compilation
        run: |
          export KBUILD_BUILD_USER="kepin"
          export KBUILD_BUILD_HOST="lol"
          export PATH=$PWD/clang/bin:$PATH
          
          mkdir -p out
          make -j$(nproc --all) ARCH=arm64 SUBARCH=arm64 O=out merlin_defconfig

          make -j$(nproc --all) ARCH=arm64 SUBARCH=arm64 O=out LLVM=1 LLVM_IAS=1 \
              CC="clang" \
              AR="llvm-ar" \
              NM="llvm-nm" \
              LD="ld.lld -S" \
              OBJCOPY="llvm-objcopy" \
              OBJDUMP="llvm-objdump" \
              STRIP="llvm-strip" \
              CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              CROSS_COMPILE_COMPAT="arm-linux-gnueabi-" \
              CONFIG_DEBUG_SECTION_MISMATCH=y

      - name: Archive Kernel Image (AnyKernel3 / zImage/Image.gz-dtb)
        uses: actions/upload-artifact@v4
        with:
          name: Merlin-Kernel-Output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
