name: Build Merlin Kernel (Salsachan-Nekopieee)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout Action Builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Kosongkan Disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 git patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil Clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Clone Kernel Base (KevinSuharjo/android_kernel_xiaomi_mt6768-s:kernel-tree-7)
        run: |
          git clone --depth=1 -b kernel-tree-7 \
            https://github.com/KevinSuharjo/android_kernel_xiaomi_mt6768-s.git kernel

      - name: Bersihkan EXTRAVERSION di Makefile
        working-directory: kernel
        run: |
          sed -i -E 's/^(EXTRAVERSION\s*=\s*).*/\1/' Makefile
          head -n 5 Makefile

      - name: Setup KernelSU (backslashxx - Branch Link Mode)
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Setup & Patch SUSFS 4.14 (Level Kernel Root Stealth)
        working-directory: kernel
        run: |
          echo "=== Cloning SUSFS kernel-4.14 from simonpunk ==="
          git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs
          
          # 1. Copy SUSFS core source & headers
          cp -r /tmp/susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -r /tmp/susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          
          # 2. Patch KernelSU for SUSFS support
          if [ -d "KernelSU" ]; then
            cd KernelSU && patch -p1 < /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
          elif [ -d "drivers/kernelsu" ]; then
            cd drivers/kernelsu && patch -p1 < /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
          fi
          
          # 3. Patch Kernel 4.14 VFS hooks
          if [ -f "/tmp/susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch" ]; then
            patch -p1 < /tmp/susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || echo "Notice: SUSFS kernel patch applied or needs manual review"
          fi

      - name: Fragment EROFS
        working-directory: kernel
        run: |
          mkdir -p arch/arm64/configs
          cat << 'EOF' > arch/arm64/configs/erofs.config
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
          EOF

      - name: Inject KernelSU, SUSFS, BBR, DroidSpace, Custom Name & Performance Configs
        working-directory: kernel
        run: |
          mkdir -p arch/arm64/configs
          cat << 'EOF' > arch/arm64/configs/merlin.config

          # Custom Kernel Name
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_LOCALVERSION="-salsachan-nekopieee-hyperos+"

          # Matikan KPROBES total (Adem & bebas kernel panic)
          # CONFIG_KPROBES is not set
          # CONFIG_HAVE_KPROBES is not set
          # CONFIG_KRETPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set

          # KernelSU dengan ARM64 Branch Link (Anti-ribet)
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y

          # SUSFS (Super User S-Flag) - Root Stealth untuk M-Banking
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n

          # Google BBR TCP Congestion Control (Low Ping Gaming & Anti Buffer)
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_INET_TCP_FASTOPEN=y

          # Fast Compression for ZRAM 4GB (LZ4 & ZSTD)
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y

          # Schedutil CPU Governor Tuning
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y

          # DroidSpace Kernel Requirements (Namespaces & Netfilter)
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_VETH=y
          CONFIG_MACVLAN=y
          CONFIG_BRIDGE=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          EOF
          cat arch/arm64/configs/merlin.config

      - name: Generate build.sh Langsung
        working-directory: kernel
        run: |
          cat << 'EOF' > build.sh
          #!/bin/bash
          set -e

          mkdir -p out

          export KBUILD_BUILD_USER="kepin"
          export KBUILD_BUILD_HOST="lol"

          # Setup Clang path
          export PATH=$PWD/clang/bin:$PWD/../clang/bin:$PATH
          export LD_LIBRARY_PATH=$PWD/clang/lib64:$PWD/../clang/lib64:$LD_LIBRARY_PATH

          CFG=arch/arm64/configs

          # Fragment config yang digabung (merlin_defconfig sebagai basis)
          FRAGMENTS="$CFG/merlin_defconfig"
          [ -f "$CFG/merlin.config" ] && FRAGMENTS="$FRAGMENTS $CFG/merlin.config"
          [ -f "$CFG/erofs.config" ]  && FRAGMENTS="$FRAGMENTS $CFG/erofs.config"
          [ -f "$CFG/ksu.config" ]    && FRAGMENTS="$FRAGMENTS $CFG/ksu.config"
          echo "Fragment yang dipakai: $FRAGMENTS"

          ARCH=arm64 scripts/kconfig/merge_config.sh -O "out" $FRAGMENTS

          make -j$(nproc --all) ARCH=arm64 SUBARCH=arm64 O=out LLVM=1 LLVM_IAS=1 \
          	CC="clang" \
          	AR="llvm-ar" \
          	NM="llvm-nm" \
          	LD="ld.lld -S" \
          	OBJCOPY="llvm-objcopy" \
          	OBJDUMP="llvm-objdump" \
          	STRIP="llvm-strip" \
          	CLANG_TRIPLE="aarch64-linux-gnu-" \
          	CROSS_COMPILE="aarch64-linux-gnu-" \
          	CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          	CROSS_COMPILE_COMPAT="arm-linux-gnueabi-" \
          	CONFIG_DEBUG_SECTION_MISMATCH=y \
          	Image.gz-dtb
          EOF
          chmod +x build.sh

      - name: Build Kernel dengan build.sh
        working-directory: kernel
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || {
            echo "================ ERROR LOG ================"
            grep -E -C 3 "error:|fatal error:" build.log | tail -n 100 || tail -n 150 build.log
            exit 1
          }

      - name: Kumpulkan Hasil Build
        run: |
          mkdir -p result
          cp kernel/out/arch/arm64/boot/Image kernel/out/arch/arm64/boot/Image.gz result/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb result/ 2>/dev/null || true
          cp kernel/out/.config result/config
          cp kernel/build.log result/
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -I{} cp {} result/ 2>/dev/null || true
          ls -lh result

      - uses: actions/upload-artifact@v4
        with:
          name: merlin-salsachan-nekopieee-kernel
          path: result/
